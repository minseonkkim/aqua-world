name: Auto Base Branch

on:
  pull_request:
    types: [opened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  retarget-base:
    name: Set base branch from linked issue milestone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const MARKER = '<!-- auto-base-branch -->';

            // 실패해도 로그에만 남으면 눈에 띄지 않으므로, 결과를 PR에 코멘트로 남긴다.
            // edited 마다 새 코멘트가 쌓이지 않게 마커로 찾아 갱신한다.
            const notify = async (message) => {
              const body = `${MARKER}\n${message}`;
              const { data: comments } = await github.rest.issues.listComments({
                ...context.repo,
                issue_number: pr.number,
                per_page: 100,
              });
              const existing = comments.find((comment) => (comment.body || '').includes(MARKER));
              if (!existing) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
                return;
              }
              if (existing.body === body) return;
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            };

            const numbers = new Set();

            // 이슈에서 만든 브랜치는 `20-버튼-통해-먹이-줄-때-연출`처럼 번호가 앞에 붙는다.
            const fromBranch = /^(\d+)-/.exec(pr.head.ref);
            if (fromBranch) numbers.add(Number(fromBranch[1]));

            // 본문의 closing 키워드는 보조 수단 (브랜치 이름이 규칙을 벗어난 경우 대비)
            const regex = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)/gi;
            let match;
            while ((match = regex.exec(pr.body || '')) !== null) {
              numbers.add(Number(match[1]));
            }

            // 릴리즈 PR(v1.0.2 -> main)처럼 이슈가 없는 PR은 조용히 통과시킨다.
            if (numbers.size === 0) return core.info('브랜치 이름과 본문 어디에서도 이슈 번호를 찾지 못함.');

            const milestones = new Set();
            for (const issue_number of numbers) {
              try {
                const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number });
                if (issue.pull_request) continue;
                if (issue.milestone) milestones.add(issue.milestone.title);
              } catch (error) {
                core.warning(`Failed to fetch #${issue_number}: ${error.message}`);
              }
            }

            const linked = [...numbers].map((n) => `#${n}`).join(', ');

            if (milestones.size === 0) {
              await notify(`연결된 이슈(${linked})에 마일스톤이 없어 base 브랜치를 자동 변경하지 못했습니다.`);
              return core.info('Linked issues have no milestone.');
            }
            if (milestones.size > 1) {
              await notify(`연결된 이슈의 마일스톤이 서로 달라(${[...milestones].join(', ')}) base 브랜치를 자동 변경하지 못했습니다.`);
              return core.warning('마일스톤이 서로 다름 — base 변경 생략');
            }

            const target = [...milestones][0];
            if (pr.base.ref === target) return core.info(`Base already ${target}.`);

            try {
              await github.rest.repos.getBranch({ ...context.repo, branch: target });
            } catch {
              await notify(`마일스톤 \`${target}\`과 같은 이름의 브랜치가 없어 base 브랜치를 자동 변경하지 못했습니다. \`${target}\` 브랜치를 먼저 만들어주세요.`);
              return core.warning(`브랜치 '${target}'가 없어 base를 변경하지 못함`);
            }

            const previous = pr.base.ref;
            await github.rest.pulls.update({ ...context.repo, pull_number: pr.number, base: target });
            await notify(`이슈 ${linked}의 마일스톤에 따라 base 브랜치를 \`${previous}\` → \`${target}\`(으)로 자동 변경했습니다.`);
            core.info(`Retargeted base ${previous} -> ${target}.`);
