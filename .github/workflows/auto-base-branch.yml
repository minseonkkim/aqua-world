name: Auto Base Branch

on:
  pull_request:
    types: [opened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  retarget-base:
    name: Set base branch from linked issue milestone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const regex = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)/gi;

            const numbers = new Set();
            let match;
            while ((match = regex.exec(body)) !== null) {
              numbers.add(Number(match[1]));
            }
            if (numbers.size === 0) return core.info('No closing keywords found.');

            const milestones = new Set();
            for (const issue_number of numbers) {
              try {
                const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number });
                if (issue.pull_request) continue;
                if (issue.milestone) milestones.add(issue.milestone.title);
              } catch (error) {
                core.warning(`Failed to fetch #${issue_number}: ${error.message}`);
              }
            }

            if (milestones.size === 0) return core.info('Linked issues have no milestone.');
            if (milestones.size > 1) {
              return core.warning(`마일스톤이 서로 다름 (${[...milestones].join(', ')}) — base 변경 생략`);
            }

            const target = [...milestones][0];
            if (pr.base.ref === target) return core.info(`Base already ${target}.`);

            try {
              await github.rest.repos.getBranch({ ...context.repo, branch: target });
            } catch {
              return core.warning(`브랜치 '${target}'가 없어 base를 변경하지 못함`);
            }

            await github.rest.pulls.update({ ...context.repo, pull_number: pr.number, base: target });
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: pr.number,
              body: `이슈 마일스톤에 따라 base 브랜치를 \`${pr.base.ref}\` → \`${target}\`(으)로 자동 변경했습니다.`,
            });
            core.info(`Retargeted base ${pr.base.ref} -> ${target}.`);
