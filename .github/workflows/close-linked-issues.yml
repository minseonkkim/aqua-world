name: Close Linked Issues

on:
  pull_request:
    types: [closed]

permissions:
  issues: write

jobs:
  close-linked-issues:
    name: Close issues referenced by closing keywords
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const numbers = new Set();

            // 이슈에서 만든 브랜치는 `20-버튼-통해-먹이-줄-때-연출`처럼 번호가 앞에 붙는다.
            const fromBranch = /^(\d+)-/.exec(pr.head.ref);
            if (fromBranch) numbers.add(Number(fromBranch[1]));

            // 본문의 closing 키워드는 보조 수단 (브랜치 이름이 규칙을 벗어난 경우 대비)
            const regex = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)/gi;
            let match;
            while ((match = regex.exec(pr.body || '')) !== null) {
              numbers.add(Number(match[1]));
            }

            if (numbers.size === 0) {
              core.info('브랜치 이름과 본문 어디에서도 이슈 번호를 찾지 못함.');
              return;
            }

            for (const issue_number of numbers) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  ...context.repo,
                  issue_number,
                });

                if (issue.pull_request) {
                  core.info(`#${issue_number} is a PR, skipping.`);
                  continue;
                }
                if (issue.state !== 'open') {
                  core.info(`#${issue_number} is already closed, skipping.`);
                  continue;
                }

                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number,
                  body: `#${pr.number} 머지로 자동 닫힘 (base: \`${pr.base.ref}\`)`,
                });
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                core.info(`Closed #${issue_number}.`);
              } catch (error) {
                core.warning(`Failed to close #${issue_number}: ${error.message}`);
              }
            }
