name: Close Linked Issues

on:
  pull_request:
    types: [closed]

permissions:
  issues: write

jobs:
  close-linked-issues:
    name: Close issues referenced by closing keywords
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const regex = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)/gi;

            const numbers = new Set();
            let match;
            while ((match = regex.exec(body)) !== null) {
              numbers.add(Number(match[1]));
            }

            if (numbers.size === 0) {
              core.info('No closing keywords found in PR body.');
              return;
            }

            for (const issue_number of numbers) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  ...context.repo,
                  issue_number,
                });

                if (issue.pull_request) {
                  core.info(`#${issue_number} is a PR, skipping.`);
                  continue;
                }
                if (issue.state !== 'open') {
                  core.info(`#${issue_number} is already closed, skipping.`);
                  continue;
                }

                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number,
                  body: `#${pr.number} 머지로 자동 닫힘 (base: \`${pr.base.ref}\`)`,
                });
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                core.info(`Closed #${issue_number}.`);
              } catch (error) {
                core.warning(`Failed to close #${issue_number}: ${error.message}`);
              }
            }
