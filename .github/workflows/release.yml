name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: '버전 증가 단위'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  release:
    name: Bump version & tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint & type-check
        run: |
          npm run lint
          npm run type-check

      - name: Bump package.json version
        id: version
        run: |
          NEW_VERSION=$(npm version ${{ inputs.bump }} --no-git-tag-version | sed 's/^v//')
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump Android version
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          CURRENT_CODE=$(grep -oP 'versionCode \K[0-9]+' android/app/build.gradle)
          NEW_CODE=$((CURRENT_CODE + 1))
          sed -i "s/versionCode [0-9]\+/versionCode $NEW_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$NEW_VERSION\"/" android/app/build.gradle

      - name: Bump in-app version
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          sed -i -E "s/(export const APP_VERSION = ')[^']*(')/\1${NEW_VERSION}\2/" src/services/feedback.ts
          # sed 는 패턴을 못 찾아도 성공으로 끝난다 — 그대로 넘어가면 설정 > 정보 버전이 또 굳는다(#28).
          grep -q "APP_VERSION = '${NEW_VERSION}'" src/services/feedback.ts

      - name: Update README version badge
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          sed -i -E "s#(badge/version-)[0-9]+\.[0-9]+\.[0-9]+(-)#\1${NEW_VERSION}\2#" README.md

      - name: Commit, tag & push
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json android/app/build.gradle src/services/feedback.ts README.md
          git commit -m "v${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push origin HEAD:main
          git push origin "v${NEW_VERSION}"
