name: Apply Main PR Template

on:
  pull_request:
    types: [opened, edited]

permissions:
  pull-requests: write

jobs:
  apply-template:
    name: Replace body with full template for main-targeted PRs
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const currentBody = (pr.body || '').trim();
            const defaultBody = 'Closes #이슈번호';

            if (currentBody !== '' && currentBody !== defaultBody) {
              return core.info('PR body already customized — skip.');
            }

            const template = fs.readFileSync('.github/PULL_REQUEST_TEMPLATE/main.md', 'utf8');
            await github.rest.pulls.update({
              ...context.repo,
              pull_number: pr.number,
              body: template,
            });
            core.info('Applied main PR template.');
